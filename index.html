<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pixel Quest - Platform Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-wrap">

    <div class="hud">
      <span>COINS: <b id="coins">0</b></span>
      <span>SCORE: <b id="score">0</b></span>
      <span>LIVES: <b id="lives">3</b></span>
    </div>

    <canvas id="game"
            width="960"
            height="540">
    </canvas>

    <div class="help">
      ← → Move &nbsp; | &nbsp;
      Space / ↑ Jump &nbsp; | &nbsp;
      R Restart
    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
